<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Student Registration</h1>
    <form id="regForm" novalidate>
      <label for="first">First Name <span class="required">*</span></label>
      <input type="text" id="first" name="first" required />
      <small class="error" id="err-first"></small>

      <label for="last">Last Name <span class="required">*</span></label>
      <input type="text" id="last" name="last" required />
      <small class="error" id="err-last"></small>

      <label for="email">Email<span class="required">*</span></label>
      <input type="email" id="email" name="email" required />
      <small class="error" id="err-email"></small>

      <label for="prog">Programme <span class="required">*</span></label>
      <input type="text" id="prog" name="prog" required />
      <small class="error" id="err-prog"></small>


      <label>Year of Study <span class="required">*</span></label>
      <fieldset>
        <label><input type="radio" name="year" value="1" required /> 1</label>
        <label><input type="radio" name="year" value="2" required/> 2</label>
        <label><input type="radio" name="year" value="3" required/> 3</label>
        <label><input type="radio" name="year" value="4" required/> 4</label>
        <small class="error" id="err-year"></small>
      </fieldset>

      <label for="interests">Interests</label>
      <input type="text" id="interests" name="interests" />

      <label for="photo">Upload Photo *</label>
      <input type="file" id="photo" name="photo" accept="image/*" />
      <small class="error" id="err-photo"></small>

      <div aria-live="polite" class="sr" id="live"></div>
    


      <button type="submit">Submit</button>  <button type="clearBtn">Clear</button>
    </form>

    <h2>Search Students</h2>
    <input type="text" id="searchInput" placeholder="Search by name or programme..." />
    <button id="searchBtn">Search</button>
    <button id="clearSearchBtn">Clear</button>

    <h2>Registered Students</h2>
    <section id="cards" class="card-container"></section>

    <h2>Summary Table</h2>
    <table id="summary">
      <thead>
        <tr>
          <th>Name</th>
          <th>Programme</th>
          <th>Year</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
